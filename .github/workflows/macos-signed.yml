name: macOS Signed Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PRODUCT_NAME: FlexDisplay
  BUNDLE_ID: com.cicadahk.flexdisplay

jobs:
  build-sign-notarize:
    name: Build · Sign · Notarize
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE_P12_BASE64:-}" ]; then
            echo "::error::Missing secret APPLE_CERTIFICATE_P12_BASE64"
            exit 1
          fi
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Resolve signing identity
        id: identity
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::Missing secret APPLE_TEAM_ID"
            exit 1
          fi
          # Prefer Developer ID Application for outside-App-Store distribution
          IDENTITY=$(security find-identity -v -p codesigning | \
            sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in keychain. Export that cert as .p12."
            security find-identity -v -p codesigning || true
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "Using identity: $IDENTITY"
          echo "team_id=$APPLE_TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Build Release (signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project FlexDisplay.xcodeproj \
            -scheme FlexDisplay \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath build/FlexDisplay.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ENABLE_HARDENED_RUNTIME=YES

          # Export .app from archive
          APP_SRC="build/FlexDisplay.xcarchive/Products/Applications/${PRODUCT_NAME}.app"
          test -d "$APP_SRC"
          mkdir -p dist
          ditto "$APP_SRC" "dist/${PRODUCT_NAME}.app"
          codesign -dv --verbose=2 "dist/${PRODUCT_NAME}.app" || true
          codesign --verify --deep --strict --verbose=2 "dist/${PRODUCT_NAME}.app"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v"
              exit 1
            fi
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          # notarytool profile via key file flags (no keychain store needed)

      - name: Notarize
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/${PRODUCT_NAME}.app" "dist/${PRODUCT_NAME}-for-notary.zip"
          xcrun notarytool submit "dist/${PRODUCT_NAME}-for-notary.zip" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "dist/${PRODUCT_NAME}.app"
          spctl --assess --type execute -vv "dist/${PRODUCT_NAME}.app" || true

      - name: Package zip + dmg
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "dist/${PRODUCT_NAME}.app/Contents/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "dist/${PRODUCT_NAME}.app/Contents/Info.plist")
          ZIP_NAME="${PRODUCT_NAME}-${VERSION}.${BUILD}-macOS.zip"
          DMG_NAME="${PRODUCT_NAME}-${VERSION}.${BUILD}-macOS.dmg"

          ditto -c -k --keepParent "dist/${PRODUCT_NAME}.app" "dist/${ZIP_NAME}"

          # Simple UDZO dmg
          STAGE="$RUNNER_TEMP/dmgroot"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          ditto "dist/${PRODUCT_NAME}.app" "$STAGE/${PRODUCT_NAME}.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$PRODUCT_NAME" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/${DMG_NAME}"

          ls -lh dist/
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlexDisplay-signed-macOS
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
