name: FlexDisplay
options:
  bundleIdPrefix: app.flexdisplay
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: app.flexdisplay.FlexDisplay
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
targets:
  FlexDisplay:
    type: application
    platform: macOS
    sources:
      - path: Sources/FlexDisplay
        type: group
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Info.plist
        buildPhase: none
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: FlexDisplay
        # Sandbox OFF for Debug — display mode / gamma APIs need non-sandboxed process
        CODE_SIGN_ENTITLEMENTS: Resources/FlexDisplay.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
